# --- WhatsApp messaging ---
# Sends through WhatsApp Web. There is no API and no credential: auth is a
# WhatsApp Web session in a browser profile. Two backends:
#
#   playwright  California's own browser profile (profile_dir), driven by
#               Playwright. Enter goes to the page, never the OS keyboard, so the
#               laptop stays usable; the page stays open between sends; "sent"
#               means a sent tick was seen. Link the profile once:
#                   uv run python tools/link_whatsapp.py
#               On Windows it drives the Edge that ships with the OS, so there is
#               nothing to download. On the Pi (64-bit OS only) run once:
#                   uv run playwright install chromium
#   keyboard    The original Firefox + pyautogui path. Raises a window, takes the
#               keyboard for ~15s, cannot confirm delivery, Windows only. Kept as
#               a one-line rollback.
#
#   Needs: uv sync --extra default
#
# contacts_path: a VCF export of the phone's address book. Gitignored, because
#   it is a few hundred real people's phone numbers. Export it from the phone's
#   contacts app and drop it at this path; without it only explicit phone
#   numbers resolve.
#
# aliases: spoken nickname -> the exact FN in the VCF. These are the only
#   contacts named in the system prompt (the full book is far too large to send
#   on every turn), and an alias hit always sends without asking.
whatsapp:
  enabled: true
  backend: "playwright"
  contacts_path: "contacts.vcf"
  default_country: "351"          # bare 9-digit numbers in the VCF are Portuguese
  confirm_timeout_ms: 120000      # how long a read-back stays answerable
  # --- playwright backend ---
  profile_dir: ".whatsapp_profile"   # gitignored; holds the linked session
  # browser_channel: "msedge"        # default: msedge on Windows, bundled chromium elsewhere
  headless: true                     # no window at all
  keep_warm: true                    # open WhatsApp Web at boot so the first send skips the launch
  idle_close_minutes: 30             # close the browser after this long unused; 0 = never
  send_timeout_ms: 30000             # chat open + sent tick must happen inside this
  # --- keyboard backend ---
  firefox_path: 'C:\Program Files\Mozilla Firefox\firefox.exe'
  wait_ms: 12000                  # WhatsApp Web load time before Enter is pressed
  # Spoken nickname -> exact contact name (FN) in contacts.vcf. The REAL ones
  # live in aliases_path, gitignored like contacts.vcf: this repo is public and
  # that file says who his family and friends are. Entries there are merged
  # over the (example-only) block below. A value is a contact name, or
  # {contact: "...", prefer: "+351"} to choose which of the contact's numbers.
  # An exact nickname wins even over a tie in the book; a full contact name
  # still wins over a loose nickname match. See WhatsAppService.resolve_contact.
  aliases_path: "whatsapp_aliases.yaml"
  aliases: {}
    # the landlord: "Joao Silva"
    # mum: {contact: "Maria Silva", prefer: "+351"}
