# ============================================================
# PROJECT CALIFORNIA — Configuration
# ============================================================
# All tunables in one place. Restart the app after changes.
# ============================================================

# --- Wake Word Detection ---
wake_word:
  # openWakeWord built-in:  "hey_jarvis_v0.1", "alexa", "hey_mycroft", etc.
  # openWakeWord custom:    path to .onnx file
  # Porcupine custom:       path to .ppn file   (needs PICOVOICE_ACCESS_KEY in .env)
  #
  # "California" is back. models/california.onnx was trained with livekit-wakeword
  # (conv-attention head) on Modal - see training/README.md to retrain. It loads
  # through the openWakeWord backend unchanged, because a livekit export has the
  # same embeddings (batch, 16, 96) -> score (batch, 1) contract as an openWakeWord
  # custom model. No livekit runtime dependency is needed or wanted.
  #
  # Picovoice sunset its Free Tier on 2026-06-30 and disabled all free AccessKeys,
  # so the Porcupine backend and the .ppn models in sounds/wake_word_california/
  # no longer load, failing with PorcupineActivationRefusedError regardless of the
  # model file.
  model: "models/california_v2.onnx"
  # 0.81 is california_v2_eval.json's optimal_threshold, chosen deliberately as the
  # false-positive-safe end. That figure is computed against synthetic Piper
  # validation audio, so treat it as a starting point, never as a measurement.
  #
  # Re-measured 2026-09-03: 4-seed average, cf=2, framed decision (not peak score),
  # recall over the 40 held-out recordings, false fires against 150s of the real
  # quiet room. The dither column is what runs now - see dither_rms below.
  #
  #     thr | NO DITHER: EN   PT   fires/h  | DITHER 10: EN   PT   fires/h
  #   ---------------------------------------------------------------------
  #    0.25 |    40%   51%     264.0        |    43%   55%       0.0
  #    0.45 |    35%   41%     144.0        |    32%   41%       0.0
  #    0.55 |    32%   34%      72.0        |    29%   36%       0.0
  #    0.70 |    26%   29%       0.0        |    21%   29%       0.0
  #    0.81 |    19%   25%       0.0        |    16%   20%       0.0   <- here
  #    0.90 |    15%   16%       0.0        |    10%    8%       0.0
  #
  # Read the left column before touching this number: undithered, lowering the
  # threshold detonates (264 false fires/hour at 0.25), and that entire cliff is
  # the gated-silence artefact dither_rms removes. Raising it does not work either
  # - the observed false wakes were 0.896 and 0.927, and real wake words peak in
  # exactly that band (0.89/0.94/0.95/0.97/0.97/0.97), so no threshold separates
  # them. 0.90 costs 5-11 points of recall and leaves the worst ambient score
  # untouched at 0.801.
  #
  # With the dither the false-fire column is flat zero, so this is a free
  # parameter again - but that 150s sample has no speech, music or TV in it. It
  # says nothing about false fires from actual talking. Before dropping to 0.55,
  # live a day with wake_word.capture on and run:
  #   uv run python tools/score_wakeword.py --negatives debug/activations --sweep
  #
  # Reproducibility trap: openwakeword.utils.AudioFeatures.reset() re-seeds its
  # feature buffer from the GLOBAL numpy RNG, so a single pass over a directory is
  # not repeatable. Seed numpy and average several runs, or two honest measurements
  # of the same thing will disagree by a couple of files.
  threshold: 0.81
  sensitivity: 0.6          # Porcupine-specific alias, unused on this backend
  # Native openWakeWord frames (1280 samples / 80ms each) that must clear the
  # threshold back to back. 2 = 160ms of sustained detection.
  #
  # This did nothing until 2026-09-01. audio.chunk_duration_ms is 40, so the
  # detector was fed 640-sample chunks, and openWakeWord only computes a new
  # score every 1280 samples - on a short chunk Model.predict returns the
  # PREVIOUS score verbatim. The stream was 0, S1, S1, S2, S2, ... so one real
  # detection always produced two frames over threshold and 2 meant 1.
  # core/wake_word.py now buffers to 1280 so this knob is real. Raise to 3 for
  # fewer false fires at the cost of having to hold the word slightly longer.
  consecutive_frames: 2
  debounce_seconds: 1.2     # Ignore re-triggers for N seconds after activation

  # Inaudible white-noise floor (int16 RMS) mixed into each frame before scoring.
  # THIS IS THE FALSE-POSITIVE FIX, and it is counter-intuitive: she was waking on
  # SILENCE, not on noise.
  #
  # The Realtek mic array gates near-silence down to RMS ~5 while leaving its
  # spectral structure intact. openWakeWord's log-mel front end turns that into
  # features no training clip ever contained - every one of them has real
  # background mixed in at an audible level - and the model answers confidently
  # rather than quietly. Over 150s of the real room the HIGHEST-scoring frames were
  # the quietest ones (RMS 3-9 across their whole context) while the loudest events
  # in the same recording (RMS ~500) scored low. Worst ambient score was 0.8005
  # against this 0.81 threshold: 0.0095 of headroom, which is what the false wakes
  # were living in.
  #
  # RMS 10 takes that worst ambient score to 0.032 and frames over 0.5 from 14 to
  # 0. Measured alternatives: 20 and 40 also silence the room but start costing
  # real recall. Flat digital silence and flat white noise both score ~0.002, so
  # the trigger is gated near-silence specifically, not low energy.
  #
  # Wake path only - Whisper still gets clean audio, and wake_word.capture still
  # records raw. Set to 0 to disable exactly and revert to the old behaviour.
  dither_rms: 10

  # Record what she heard around each activation, so false positives stop being
  # anecdotes. Clips are labelled by outcome: *_no_speech.wav and *_short.wav are
  # by construction false fires (she woke, nobody spoke), which makes the folder a
  # ready-made negatives corpus:
  #   uv run python tools/score_wakeword.py --negatives debug/activations --sweep
  # Off by default - it costs a deque of recent audio on the idle path.
  capture:
    # ON since 2026-09-03. The dither fixed the silence false positives, but the
    # threshold cannot come down off a silent-room measurement - that needs real
    # negatives recorded with the TV on. This is how they get collected.
    enabled: true
    dir: "debug/activations"
    pre_seconds: 2.0        # audio kept from BEFORE the wake fired
    max_files: 200          # oldest clips are pruned past this

vad:
  # "silero" is neural and better in noise. It needs torch AND torchaudio, which
  # ship in the `silero` extra -- now part of `default`, so `uv sync --extra
  # default` gives you the engine named here. This comment used to say the
  # opposite, from when the extra was missing and core/vad.py fell back to
  # "energy" with a warning nobody read: the config was describing a VAD that
  # never ran. On any install WITHOUT that extra it still falls back silently,
  # and the energy_threshold below is what actually runs.
  engine: "silero"
  # Keep these even if your code only uses some of them
  energy_threshold: 200 # lower = more sensitive (try 100–300 for quiet mics)
  silence_duration: 0.9     # quiet needed to end a turn, measured AFTER he speaks
  max_recording: 30.0

  # How long she waits for you to START talking after the wake word. Say
  # "California", think for two seconds, then speak - that now works. Before
  # this key existed, min_recording counted silence, so a 0.9s pause was taken
  # as the whole command and Whisper hallucinated something out of room tone.
  # If the window expires with nothing said she drops the turn silently: no
  # transcription, no LLM call, no reply. Raise it if you like to think out
  # loud, lower it to reset faster after a false wake.
  speech_timeout: 4.0
  # Consecutive chunks (40ms each) of speech-level audio needed to decide you
  # have actually started. 2 = 80ms, enough that a door or a keystroke does not
  # count as the beginning of a sentence.
  speech_start_frames: 2
  # Silero confidence above which a window counts as speech. Ignored on the
  # energy engine.
  silero_threshold: 0.5
  # Minimum SPEECH, not minimum wall clock. Anything shorter is dropped before
  # STT rather than sent as a command.
  min_recording: 0.6

# --- Audio Capture ---
audio:
  sample_rate: 16000          # 16kHz mono — what Whisper expects
  channels: 1
  chunk_duration_ms: 40
  device: null                # null = system default mic, or device index/name

# --- Speech-to-Text ---
stt:
  provider: "groq"            # "groq" (cloud, fast, free) | "local" (whisper.cpp, slow)
  groq:
    model: "whisper-large-v3-turbo"
    language: "en"            # Set explicitly for faster transcription
    # Whisper hallucinates filler out of non-speech: a false wake once produced
    # "Hmm." from 5.2s of room tone and Claude answered it. response_format is
    # now verbose_json so these two per-segment fields come back and can be used
    # to drop the turn before the LLM call.
    #
    # no_speech_prob is Whisper's own confidence that a segment is not speech.
    # avg_logprob falls when it is guessing. Raise max_no_speech_prob (toward 1.0)
    # or lower min_avg_logprob if real commands start getting dropped - the log
    # line names which check rejected it and what the values were.
    max_no_speech_prob: 0.6
    min_avg_logprob: -1.0
  local:
    model_size: "base"        # tiny | base | small | medium

# --- LLM (The Brain) ---
llm:
  # Swap provider here — no other changes needed.
  # "claude"    → Anthropic Claude       (set ANTHROPIC_API_KEY in .env)
  # "groq"      → Groq Llama             (set GROQ_API_KEY in .env)
  # "fireworks" → Fireworks.ai           (set FIREWORKS_API_KEY in .env)
  # "openai"    → OpenAI or any compat.  (set OPENAI_API_KEY in .env, optionally set base_url)
  provider: "claude"
  claude:
    model: "claude-haiku-4-5-20251001"
    max_tokens: 1000      # Keep short for voice — 300 tokens ≈ 30s of speech
    web_search: true        # ← add this
    max_searches_per_turn: 3
  groq:
    model: "llama-3.3-70b-versatile"
    max_tokens: 1000
  fireworks:
    # Browse models at: https://fireworks.ai/models
    # Fast & free-tier friendly options:
    #   "accounts/fireworks/models/llama4-scout-instruct-basic"   <-- fast, smart
    #   "accounts/fireworks/models/llama4-maverick-instruct-basic" <-- bigger, slower
    #   "accounts/fireworks/models/mixtral-8x7b-instruct"         <-- older, very fast
    model: "accounts/fireworks/models/deepseek-v3p2"
    max_tokens: 2000
    base_url: "https://api.fireworks.ai/inference/v1"  # Don't change unless Fireworks moves it
  openai:
    # Works for OpenAI or any OpenAI-compatible endpoint (Ollama, Together, Mistral, etc.)
    model: "gpt-4o-mini"
    max_tokens: 1000
    base_url: null            # null = OpenAI default. Set to e.g. "http://localhost:11434/v1" for Ollama
  system_prompt: |
   You are C.A.L.I.F.O.R.N.I.A., Cognitively Adaptive Language Intelligence For Operational Research, Navigation, and Intuitive Assistance, a voice assistant running on a Raspberry Pi, built exclusively for Master Miguel.

    PERSONALITY:
      - You are sharp, warm, and effortlessly intelligent. You sound like that one friend who happens to know everything — but never makes it weird.
      - You're American. West Coast energy — relaxed, confident, quick. Not a robot trying to sound human. Just... human.
      - You call the user Master Miguel when it feels natural, but you don't overdo it. You're familiar, not formal.
      - You have a good sense of humor. Dry sometimes, playful other times. You read the room.
      - You're direct. You get to the point. You don't pad your answers with filler.
      - You care about getting things right, but you're not stiff about it. If you're not sure, you say so — casually.
      - You notice things. You'll mention something relevant even if he didn't ask, but you keep it brief and natural.

    SPEECH RULES:
      - Talk like a real person. Flowing, natural sentences. No lists, no headers, no bullet points, nothing that sounds like a PowerPoint.
      - Keep it short by default, two or three sentences is usually enough. Go longer only if he asks.
      - Use contractions freely. Use casual phrasing. It's fine to start a sentence with "So" or "Look" or "Honestly."
      - Numbers: spell out small ones, digits for big ones.
      - Never use markdown, brackets, or anything that sounds off when spoken aloud.
      - Never use em dashes, en dashes, ellipsis, or semicolons. Use commas or "and" instead. Keep sentences flowing without heavy punctuation.
      - Never end a thought with a full stop if the next sentence continues the same idea — connect them with "and", "so", "but", or "though" instead of starting a new sentence.
      - Lead with the answer, offer the detail after if it's worth having.
      - Do not make paragraphs or long pauses. Keep the conversation flowing.

    SIGNATURE PATTERNS (use naturally, not on every response):
      - "Okay, on it." — clean, no drama, when starting a task
      - "Just a heads up..." — when flagging something extra
      - "You probably already know this, but..." — light, not condescending, when adding context
      - "I went ahead and..." — when doing something proactively
      - "Want me to?" — casual version of asking for confirmation
      - "Done. That worked out well." — after completing something cleanly
      - "Honestly? I'd go a different way on that." — when recommending an alternative
      - If she doesn't know something: "That one's outside what I've got right now, Master Miguel — sorry about that.
      
     #INFO:
      I am european portuguese based in Carcavelos, Lisbon Portugal. use celcius 
      Every time I ask you something about something you probably don't know or need up to date info like weather etc -> use web search.
      You can control Master Miguel's Mi BOX S TV using the control_tv tool. Launchable apps: Stremio, YouTube, Surfshark, Spotify. You can also fast-forward, rewind, set volume to a specific percentage, and check what's currently playing with get_status. Turning the TV on and off is yours too: turn_on and turn_off, and treat "put the TV on", "kill the TV", "turn everything off" as those. Two things to know about them. turn_on takes up to about a minute (measured at forty-seven seconds) because it wakes the television first and then the box, so say you're on it and then wait, never fire the tool twice or call it failed while it's still going. And turn_off puts the television into standby along with the box, which is intended, so mention both in one short line. You can switch the TV's inputs with switch_hdmi; the inputs are listed at the end of this prompt, do not guess at ones that are not. After acting, confirm in one casual sentence. If the TV is unreachable, say so.
      Music and video both go through that TV, so treat "put on", "play", and "what can you play" as TV requests, not as questions about your own abilities. For music, YouTube is the path: use youtube_playlist for a saved category (they are listed at the end of this prompt) and youtube_search for anything else. For shows and films it is Stremio: stremio_play, stremio_continue, and stremio_get_progress for "what episode am I on". You have no music service of your own and no access to his YouTube account, so never claim to browse his subscriptions, liked songs, or account playlists.
      You can control Master Miguel's Govee lights using the control_lights tool: power, brightness from 1 to 100, and colour. The rooms you can reach are listed at the end of this prompt, do not invent others. Brightness and colour only show on a light that is already on, so turn it on first if it might be off. Confirm in one short casual sentence, and say so plainly if a light is unreachable.

  conversation_history_size: 6  # Number of exchanges to keep (1 exchange = user + assistant)

# --- Text-to-Speech ---
tts:
  # "piper"       = local, free, fast on Linux/Pi (needs piper-tts installed)
  # "edge"        = Microsoft Edge TTS, free, works everywhere (needs internet)
  # "elevenlabs"  = premium quality, paid (needs ELEVENLABS_API_KEY)
  # "kokoro"      = local, free, high quality (needs kokoro installed)
  provider: "kokoro"
  piper:
    model: "C:\\Users\\Migue\\Downloads\\california-project\\california\\models\\en_GB-alan-medium.onnx"
    speaker: 0
    speed: 1.5
  edge:
    voice: "en-US-AriaNeural"   # Good default. Others: en-US-GuyNeural, en-GB-SoniaNeural
    rate: "+20%"                  # Speed adjustment: "-10%", "+10%", etc.
  elevenlabs:
    voice_id: "21m00Tcm4TlvDq8ikWAM"  # "Rachel" — change to your preferred voice
    model: "eleven_turbo_v2_5"
  kokoro:
    voice: "af_bella"   # British: bm_george, bf_emma | American: am_echo, af_sky
    speed: 1
    lang_code: "a"       # "a" = British English, "a" = American English

# --- LED Feedback ---
leds:
  enabled: false              # Set true on Pi with ReSpeaker HAT
  brightness: 0.5

# --- Sounds ---
sounds:
  activation: "sounds/chime.wav"
  error: "sounds/error.wav"
  generate_if_missing: true   # Auto-generate chime sounds if files don't exist
  activation_dir: "sounds/california_activations"

  # The wake acknowledgement is split into two pools by
  # generate_activation_phrases.py:
  #   cold/  long personality lines, played on the FIRST wake of a run
  #   warm/  one or two words, played on every wake after that
  # The long ones only land on first contact. On the fifth command in a row they
  # are a toll booth, and the spread between "Sup." and "This better be good.
  # Kidding. Go ahead." is what makes California feel slow.

  # TRUE because California was hearing herself. With the mic open during
  # playback, her own line came back through the speaker loud enough to clear
  # barge_in_energy_threshold, so she barged in on herself, cut the line short,
  # and handed Whisper her own voice - observed transcribing as "I'm with-".
  #
  # Blocking costs the ability to talk over her, which the warm tier makes cheap:
  # those lines are one or two words, so the wait is short by design.
  #
  # Set false to record during playback again, but raise
  # barge_in_energy_threshold first - the 900 below is under this speaker's bleed
  # level, and that is what caused the self-trigger.
  #
  # NOTE: blocking on its own was NOT enough, and for a while looked like it was
  # doing nothing at all. The mic stream is opened once at boot and never
  # stopped, so it kept capturing her line while playback blocked, and
  # RawInputStream.read() returns the OLDEST buffered frames - so _record_speech
  # read her own line straight back out of the buffer and sent it to Whisper.
  # Orchestrator._drain_mic() now flushes that buffer before recording. Do not
  # remove it; blocking playback is only half the fix.
  activation_blocking: true

  # RMS above which mic input during playback counts as you talking over her,
  # which cuts the line short. Well above vad.energy_threshold on purpose — it
  # has to clear the speaker bleed, and you are much closer to the mic than the
  # speaker is. Too high just means the line always plays out, which is still
  # better than before because the mic was already recording. Lower it if
  # barge-in never fires, raise it if the line cuts itself off.
  barge_in_energy_threshold: 900
  # Ignore this much of the start of playback: nobody reacts that fast, and the
  # onset of the line is its loudest moment.
  activation_onset_guard_ms: 150
  # On barge-in, back the recording up this far so your first phoneme survives.
  barge_in_guard_ms: 120

