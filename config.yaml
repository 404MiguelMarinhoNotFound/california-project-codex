# --- Mi BOX S / Android TV ---
media:
  enabled: true
  adb_path: "C:\\platform-tools\\adb.exe"
  adb_timeout_ms: 15000
  # mibox_ip is a cached HINT, not configuration -- the same contract as
  # cec_wake.tv_ip. Identity keys off discovery.mibox_mac + mibox_serial, both
  # stable. A DHCP move self-heals into the discovery cache and NOTHING at runtime
  # rewrites this line; it only matters on a first run with an empty cache.
  # It drifted .35 -> .40 on a renewal (no reboot, 9.6 days uptime) and broke every
  # TV tool call, which is why discovery exists.
  mibox_ip: "192.168.1.200"   # static, set on the box 2026-09-22 (DHCP pool is .2-.199)
  adb_port: 5555
  volume_max_steps: 15            # Mi Box S hardware max — ADB fallback only, when tv_volume is off

  # --- Volume: the TELEVISION's, over UPnP ---
  # The Samsung answers SOAP RenderingControl on :9197 while it is on: its own
  # 0-100 volume (the number on screen), read and set in one call. Measured
  # 2026-09-24 on the UE49M5505: GetVolume 36ms, SetVolume 46ms, no pairing, no
  # 401. Replaces up to 30 ADB keyevents on the box's 0-15 scale, which on this
  # setup usually sits at 15/15 so "louder" did nothing audible.
  # The address comes from cec_wake's MAC + duid ladder. TV off = "the TV looks
  # off", never a silent fallback to the box. Set enabled: false to go back to
  # the old ADB path.
  tv_volume:
    enabled: true
    port: 9197
    step: 5                 # plain "louder"/"quieter"; the room sits around 13
    max_percent: 40         # rising past this needs the same number asked twice
    confirm_window_s: 60    # ...within this long
    timeout_ms: 2000

  # --- Finding the box when its address moves ---
  discovery:
    enabled: true
    # wlan0 MAC. The dead-routes note calls this "randomised, unstable across
    # reconnects" -- true of Android's per-NETWORK randomisation, false within one
    # SSID: measured byte-identical weeks apart and in the live ARP table. It
    # changes on a new SSID or a factory reset, not on a DHCP renewal, which is the
    # only case this exists for. Nothing DEPENDS on it -- if it changes, the ARP
    # rung goes dead and the port scan still finds the box by serial.
    mibox_mac: "9c:12:21:1c:95:ae"   # device MAC; randomized-per-SSID MAC switched off 2026-09-22
    # ro.serialno. Permanent, and the duid-equivalent. Without it a stale address
    # that another device with wireless debugging on has taken would accept
    # `adb connect` and then accept keyevents.
    mibox_serial: "40152700001181340"
    state_path: "device_state.json"
    # NEVER raise this toward adb's own connect timeout. Measured 2026-09-05:
    # verifying the right box is 0.37s, but `adb connect` to a host with 5555
    # closed is 21.1s -- which is the whole reason no unverified host is ever
    # handed to adb. A /24 scan at 0.3s is 1.55s; at 21s it would be 90 minutes.
    port_probe_timeout_ms: 300
    scan_workers: 64
    # Don't rescan a LAN we just scanned. Distinct from the 30s offline cooldown,
    # which answers "don't retry a connect that just failed".
    rescan_cooldown_ms: 120000

  # --- Power / wake ---
  # ADB can turn the box OFF, and can turn it ON only while it is still on the
  # LAN. The Mi Box goes to sleep on KEYCODE_SLEEP and its firmware then
  # force-suspends ~15s later regardless of any wakelock (measured 2026-09-21);
  # once suspended adbd goes with it:
  #   input keyevent KEYCODE_SLEEP  -> ok, mWakefulness=Asleep
  #   input keyevent KEYCODE_WAKEUP -> error: closed   (deep standby)
  #   adb connect                   -> WSA 10060, every time
  # Ping is NOT a reachability test here: the box answers ICMP intermittently
  # (windows every 6-15s) because the Wi-Fi firmware's offload replies while
  # the CPU stays suspended. 12 ping-gated connects all failed. wifi_sleep_policy
  # is already 2 ("never sleep") and stay_on_while_plugged_in=3 does not prevent
  # the suspend either -- both measured 2026-09-03.
  #
  # Two wake paths, chosen by what is_awake() says:
  #   False (asleep, on the LAN) / True with the TV dark: FAST PATH. KEYCODE_WAKEUP
  #     to the box and Wake-on-LAN to the Samsung run side by side, then the CEC
  #     bus is read until the TV reports on and the box is the active source.
  #     2.2s measured 2026-09-21 (box awake at 1.7s).
  #   None (deep standby): the TELEVISION wakes it. Wake-on-LAN the Samsung and
  #     press nothing: once its CEC side is up (~37s after a cold power-on) it
  #     announces the input it came up on, and the box on HDMI 2 wakes. 34-42s
  #     measured 2026-09-25. If the box is not up by settle_ms the TV came up on
  #     another input, and the Source menu selects HDMI 2 (the rescue). The old
  #     KEY_HDMI "away and back" pair broke this: the cycle skips an input with
  #     no signal, so it parked a TV that was already on HDMI 2 on HDMI 1 for good.
  #   True with the TV dark (the normal state with tv_only_standby): power the TV
  #     (Wake-on-LAN, or KEY_POWER in shallow standby) and the box claims its
  #     input. ~3s measured 2026-09-25.
  cec_wake:
    enabled: true
    # Identity keys off things that do not move. tv_ip is only a cached hint --
    # if it goes stale, CecWaker rediscovers by MAC then duid through the same
    # DeviceFinder ladder as the box (discovery.* above sets the port-probe
    # timeout and scan width for both) and caches the answer under "tv" in
    # discovery.state_path. WoL never needs an IP at all (it is a MAC broadcast),
    # so only the websocket step is affected by a DHCP move.
    tv_mac: "54:BD:79:24:45:32"   # Samsung UE49M5505, Tizen
    tv_duid: "uuid:ce6399e0-8c5a-46f9-86b8-a05754f7a9ea"
    tv_ip: "192.168.1.201"        # static, set on the TV 2026-09-22 (DHCP pool is .2-.199)
    # tv_state_path: "tv_state.json"   # override to keep the TV in its own file; default is discovery.state_path
    tv_port: 8002
    # Written on first pairing; needs on-screen approval WITH THE TV ON.
    # Re-pair with: uv run python tools/pair_samsung_tv.py
    token_path: "samsung_token.txt"
    input_key: "KEY_HDMI"
    # Gap between keys of one sequence. samsungtvws adds a hidden 1s per key
    # unless told not to; with it off the Source-menu sequence takes ~2.5s.
    key_delay_ms: 250
    # The Source menu (TV, HDMI 1, HDMI 2, left to right on this set) needs this
    # long to open before it takes LEFT/RIGHT. LEFT does not wrap, so LEFT x
    # source_menu_left_presses then RIGHT x <port> selects a port from anywhere.
    source_menu_open_ms: 800
    source_menu_left_presses: 4
    wol_attempts: 5               # the TV took 2 in testing
    tv_boot_timeout_ms: 40000
    # Deep-standby fallback only. How long to wait for the box to rejoin the
    # network after the CEC wake.
    # MEASURED 2026-09-05 over three clean cold wakes: 32.4s, 32.4s, 31.1s from
    # wake() returning to port 5555 accepting. At the old 25000 the first attempt
    # ALWAYS timed out and the second one did the work, which is why a cold "put
    # on Fallout" took 105s end to end. 45s clears the observed max by ~40% and
    # lets attempt 1 succeed, roughly halving the cold path.
    # Re-measure before changing: a run whose log says "asleep after -1s" is not
    # a sample -- the box refuses to sleep straight after waking, so it never
    # went down and the rejoin time is meaninglessly small.
    # This is an UPPER BOUND now, not a fixed wait. _wait_for_box polls
    # sys.boot_completed and returns as soon as Android says it is up, so a
    # fast boot no longer costs the whole budget.
    settle_ms: 45000
    # Then, if the box still is not up, the Source-menu rescue gets this long.
    # 7.9s measured from a lit TV (2026-09-25).
    rescue_settle_ms: 20000
    poll_interval_ms: 2000
    # Mi Box is at CEC physical address 0x2000 == HDMI 2; HDMI 1 is a tuner
    # (CEC logical address 3). KEY_HDMI cycles only inputs with a live signal,
    # so it cannot select a sleeping box -- inputs are selected through the
    # Source menu, or by the box claiming its own. Drives the system-prompt
    # inventory, so a name here is what California will actually offer.
    hdmi_ports:
      2: "mi box"
    # Which HDMI input the box is plugged into. Matches its CEC physical address
    # 0x2000 (== HDMI 2), which the box reports itself in `dumpsys hdmi_control`.
    # Used to re-select the box when the TV has been parked on another source.
    mibox_hdmi_port: 2

    # --- Fast path (box still on the LAN) ---
    # Each half -- KEYCODE_WAKEUP + waiting for mWakefulness=Awake, and
    # Wake-on-LAN + waiting for the TV to answer REST -- gets this long before
    # the box falls back to the CEC chain above.
    fast_wake_timeout_ms: 20000
    # Then the CEC bus gets this long to say the TV is on AND showing the box,
    # one `dumpsys hdmi_control` per poll. WoL does not lift a television out of
    # SHALLOW standby (it answers REST and stays dark); the box's own wake
    # (<Text View On> + <Active Source>) does, and if the bus still says
    # "standby" the proven KEY_HDMI pair is sent once. Only evidence newer than
    # the wake counts, so a stale "standby" from hours ago cannot fail it.
    tv_confirm_timeout_ms: 12000
    tv_confirm_poll_ms: 1500
    # A box that just woke re-asserts itself as active source through its own
    # One Touch Play ~1s later. Selecting the input before that lands cost 20.7s
    # instead of 2.2s (measured 2026-09-21), so a parked input gets this grace.
    otp_grace_ms: 4000
    # The box claims its input by switching its HDMI-CEC off and on, which
    # re-announces <Active Source>; the TV follows in ~1s. Read the result after:
    claim_settle_ms: 1500

  # --- Standby depth ---
  # tv_only_standby: turn_off puts ONLY the television into standby and keeps
  # the box awake, so the next turn_on is ~3s instead of ~42s. The set
  # broadcasts <Standby> on its way off and the box obeys it -- but Android 11
  # only acts on it while HDMI control is enabled, so the box's
  # hdmi_control_enabled is switched off before KEY_POWER and back on once the
  # set is dark (cec_reenable_delay_ms later). Measured 2026-09-25: box still
  # awake 50s+ after, settings back to stock. KEY_POWEROFF is ignored by this
  # set; KEY_POWER works and is a toggle, so it is only sent behind a fresh "on"
  # reading (UPnP :9197 answering, or the CEC bus).
  # The trade: the box idles on its screensaver behind a dark set, a few watts.
  # And only California's turn_off does this -- the Samsung remote's power
  # button still sleeps the box, and the next turn_on is then the ~35s path.
  power:
    tv_only_standby: true
    tv_standby_settle_ms: 10000
    cec_reenable_delay_ms: 5000

  vpn_routing_enabled: false
  vpn_state_path: "vpn_state.json"
  vpn_status_cache_max_age_minutes: 5
  vpn_failure_policy: "open_anyway"
  vpn_route_by_app:
    youtube: "restart_autoconnect"
    stremio: "quick_connect"
  surfshark_launch_delay_ms: 400
  surfshark_connect_timeout_ms: 15000
  surfshark_status_poll_interval_ms: 1000
  surfshark_favorite_scan_pages: 2
  surfshark_favorite_scroll_delay_ms: 500
  surfshark_pre_sequence_wait_ms: 250
  surfshark_key_delay_ms: 100
  surfshark_post_sequence_wait_ms: 1200
  surfshark_restart_autoconnect_wait_ms: 5000
  surfshark_ready_timeout_ms: 8000
  surfshark_ready_poll_interval_ms: 500
  surfshark_ready_stable_polls: 2
  surfshark_ready_settle_ms: 300
  surfshark_retry_count: 1
  surfshark_debug_capture_enabled: false
  surfshark_debug_capture_dir: "debug/surfshark"
  surfshark_route_table_path: "surfshark_routes.json"
  surfshark_country_aliases:
    albania:
      - "albania"
    portugal:
      - "portugal"
  surfshark_connected_markers:
    - "connected"
    - "protected"
  surfshark_connecting_markers:
    - "connecting"
    - "reconnecting"
  surfshark_disconnected_markers:
    - "disconnected"
    - "not connected"
    - "unprotected"
  youtube_warm_launch_delay_ms: 1500     # On cross-app launches, open YouTube first and wait before the deep link
  youtube_profile_select_on_cold_start: true  # Press OK once to clear the YouTube profile picker after warm launch
  youtube_profile_select_delay_ms: 1200  # Wait after the profile OK before opening playlist/search URLs
  # "Search YouTube for X and play it". The results deep link stops at the
  # results page and never plays on its own (measured 2026-09-14: 20s on the
  # page, session untouched), and pressing into it blind is a coin flip: the
  # top result may be a video, a playlist page, a channel or a Mix. So the
  # query is resolved to the first VIDEO result over the public web results
  # page (services/youtube_search.py, no key, no account) and the box gets a
  # watch?v= link, which plays directly and restarts even a video already on.
  # Off: youtube_search just opens the results page, as before.
  youtube_search_autoplay: true
  youtube_search_resolve_timeout_ms: 5000  # HTTP budget for the results page. Measured ~1.6s from the laptop
  youtube_search_verify_ms: 6000           # How long to watch media_session for the new playback. Success returns early
  ui_dump_retry_count: 2
