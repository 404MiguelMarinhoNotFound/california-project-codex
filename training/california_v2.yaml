# California wake word, run 2 — bigger model, wider speech diversity.
#
# Run 1 (training/california.yaml) scored well on paper: 92.4% recall at 0.096
# false positives/hour. In the room it both misses Master Miguel and fires on
# words that are not the wake word. Those numbers were measured on synthetic
# Piper audio, which is the gap: 904 LibriTTS speakers reading calmly is not a
# European Portuguese speaker saying one clipped word across a room.
#
# Both failure modes at once means the model does not separate the classes well
# enough, so raising max_negative_weight is the wrong move: it would trade the
# false fires for even more misses. This run buys separation instead, through
# model capacity and a much wider spread of synthetic speech.
#
# Kept at model_name: california_v2 so run 1 stays on the Modal volume and the
# two can be scored against each other with tools/score_wakeword.py.

model_name: california_v2

target_phrases: ["california"]

# ============================================================================
# Data Generation
# ============================================================================

# 15000, not run 1's 10000 and not livekit's prod 25000. Deliberately reduced
# from the 25000 this file first carried, because real recordings are merged in
# on top (see training/README.md) and the synthetic count sets how far they get
# diluted. Trading some of Piper's 904-speaker invariance for a meaningful share
# of Master Miguel's actual voice is the right trade on a single-user device:
# the requirement is Miguel-detection, not speaker independence.
n_samples: 15000
n_samples_val: 3000
n_background_samples: 2000
n_background_samples_val: 500

tts_batch_size: 100

# The real list comes from listening to what actually false-fires. Run
#   uv run python tools/score_wakeword.py --save-clips debug/wakeword
# with the TV on, listen to the clips, and add what you hear before retraining.
custom_negative_phrases:
  # The songs. Still the main threat.
  - "hotel california"
  - "californication"
  - "california love"
  - "california gurls"
  - "california dreaming"
  - "california dreamin"
  # Morphological neighbours
  - "californian"
  - "californians"
  - "california roll"
  - "cali"
  - "calif"
  # Phonetic neighbours, and words that are common in music specifically
  - "cauliflower"
  - "carolina"
  - "caroline"
  - "cavalier"
  - "collieries"
  - "calorie"
  - "calories"
  - "gallery"
  - "celebrity"
  - "clarify"
  - "qualifier"
  - "qualified"

# ============================================================================
# TTS Parameters — this section is the recall fix
# ============================================================================

# Run 1 used a single value for each of these, so every one of its 10,000
# positives shared one timbre setting and one phoneme-duration setting. Spread
# them: a wake word said quickly, flatly, or half-swallowed should still count
# as the wake word, and the model can only learn that if it sees it.
noise_scales: [0.7, 0.98, 1.2]
noise_scale_ws: [0.8, 0.98, 1.15]

# Widened hard in both directions. 0.6 is a fast clipped "califórnia" thrown
# over a shoulder, 1.5 is a slow deliberate one. Run 1 only ever saw 0.75-1.25,
# which is a narrower range than real speech.
length_scales: [0.6, 0.75, 0.9, 1.0, 1.15, 1.3, 1.5]

# 0.1 and 0.9 added so blends land closer to the original speakers, widening the
# timbre range rather than clustering everything near the midpoint.
slerp_weights: [0.1, 0.2, 0.35, 0.5, 0.65, 0.8, 0.9]

# ============================================================================
# Paths — Modal layout
# ============================================================================

data_dir: /data
output_dir: /root/output

# ============================================================================
# Augmentation
# ============================================================================

augmentation:
  clip_duration: 2.0
  batch_size: 16
  # Left at 3. Augmentation is the wall-clock bottleneck by a wide margin
  # (measured: ~14 clips/s, and this run already triples the clip count), and a
  # 4th round buys less than the TTS spread above for the same money.
  rounds: 3
  background_paths: [/data/backgrounds]
  rir_paths: [/data/rirs]

# ============================================================================
# Model Architecture
# ============================================================================

model:
  model_type: conv_attention
  # Up from medium (128d, 2 blocks) to large (256d, 3 blocks). Inference stays
  # cheap: this runs once per 2s window on ~1500 floats, not per audio frame.
  model_size: large

# ============================================================================
# Training
# ============================================================================

# Up from 50000, matching livekit's prod config. Phases 2 and 3 add steps/10
# each, so the real total is 120,000.
steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05

# Deliberately NOT raised. The trainer already doubles this between phases when
# FPPH misses target, and pushing it higher trades away the recall that is
# already the bigger complaint.
max_negative_weight: 3000
target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
