# Smoke test — validates the whole Modal pipeline end to end in minutes, cheaply.
#
# Same shape as training/california.yaml but tiny: a few hundred clips, a tiny DNN,
# 500 steps. The model this produces is worthless for detection. The point is to
# prove that espeak-ng phonemizes "california", that the Piper checkpoint loads,
# that the volume is mounted, and that export writes a file — before you spend
# real GPU hours finding out otherwise.
#
# Run this on a T4 first. See training/README.md.

model_name: california_smoke

target_phrases: ["california"]

n_samples: 100
n_samples_val: 20
n_background_samples: 50
n_background_samples_val: 10
tts_batch_size: 10

custom_negative_phrases:
  - "hotel california"
  - "californication"
  - "californian"

data_dir: /data
output_dir: /root/output

augmentation:
  clip_duration: 2.0
  batch_size: 8
  rounds: 3
  background_paths: [/data/backgrounds]
  rir_paths: [/data/rirs]

model:
  model_type: dnn
  model_size: tiny

steps: 500
learning_rate: 0.001
max_negative_weight: 1000
target_fp_per_hour: 1.0

batch_n_per_class:
  positive: 10
  adversarial_negative: 10
  ACAV100M_sample: 64
  background_noise: 10
