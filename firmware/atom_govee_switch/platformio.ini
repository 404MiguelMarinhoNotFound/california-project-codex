; M5Stack Atom Lite as a standalone on/off switch for the attic Govee H617E strip.
; Press the button: the strip toggles. No Wi-Fi, no laptop.
;   uvx platformio run -t upload --upload-port COM3
;   uvx platformio device monitor
[env:m5stack-atom]
platform = espressif32@6.7.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
